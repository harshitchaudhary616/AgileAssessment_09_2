
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodie-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foodie
      version: blue
  template:
    metadata:
      labels:
        app: foodie
        version: blue
    spec:
      containers:
        - name: food-ordering
          image: perkeylynx/food-ordering:3
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodie-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foodie
      version: green
  template:
    metadata:
      labels:
        app: foodie
        version: green
    spec:
      containers:
        - name: food-ordering
          image: perkeylynx/food-ordering:3
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service
spec:
  type: NodePort
  selector:
    app: foodie
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30031
